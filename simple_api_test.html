<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>API Connection Test</h1>
    
    <button onclick="testWithoutAuth()">Test Without Authentication</button>
    <button onclick="testWithAuth()">Test With Authentication</button>
    
    <div id="results"></div>
    
    <script>
        const API_BASE = 'https://mr-amer-timraz.vercel.app/api/database-fix';
        
        function addResult(message, isSuccess = true) {
            const div = document.createElement('div');
            div.className = `result ${isSuccess ? 'success' : 'error'}`;
            div.innerHTML = message;
            document.getElementById('results').appendChild(div);
        }
        
        async function testWithoutAuth() {
            addResult('Testing without authentication...', false);
            
            try {
                const response = await fetch(API_BASE + '/check-tofas-status', {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                addResult(`Status: ${response.status} ${response.statusText}`, response.ok);
                
                if (response.status === 401) {
                    addResult('✅ API found but requires authentication', true);
                } else if (response.status === 404) {
                    addResult('❌ API endpoint not found - deployment issue', false);
                } else if (response.ok) {
                    const data = await response.json();
                    addResult('✅ API working without auth!', true);
                    addResult(`Data: ${JSON.stringify(data, null, 2)}`, true);
                } else {
                    addResult(`❌ Unexpected error: ${await response.text()}`, false);
                }
            } catch (error) {
                addResult(`❌ Connection failed: ${error.message}`, false);
            }
        }
        
        async function testWithAuth() {
            const token = prompt('Enter admin token:');
            if (!token) return;
            
            addResult('Testing with authentication...', false);
            
            try {
                const response = await fetch(API_BASE + '/check-tofas-status', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                addResult(`Status: ${response.status} ${response.statusText}`, response.ok);
                
                if (response.ok) {
                    const data = await response.json();
                    addResult('✅ Authentication successful!', true);
                    addResult(`Data: ${JSON.stringify(data, null, 2)}`, true);
                } else {
                    addResult(`❌ Auth failed: ${await response.text()}`, false);
                }
            } catch (error) {
                addResult(`❌ Connection failed: ${error.message}`, false);
            }
        }
        
        // Auto-test on load
        window.onload = () => testWithoutAuth();
    </script>
</body>
</html>
